[build-system]
requires = ["setuptools>=61.0", "pybind11>=2.10"]
build-backend = "setuptools.build_meta"

[project]
name = "basalt-dl"
dynamic = ["version"]
description = "Basalt Deep Learning Python bindings"
readme = "README"
license = {text = "GPL-3.0-or-later"}
authors = [{name = "Kival", email = "Kival@basalt-dl.org"}]
requires-python = ">=3.9"

[tool.setuptools]
package-dir = {"" = "python"}
packages = ["basalt"]

[tool.setuptools.dynamic]
version = {attr = "basalt._version.__version__"}
